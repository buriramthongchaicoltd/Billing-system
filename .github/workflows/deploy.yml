# GitHub Actions: build + deploy ขึ้น GitHub Pages อัตโนมัติทุกครั้งที่ push บน main
# ตั้งค่าครั้งเดียว: Repo → Settings → Pages → Source เลือก "GitHub Actions"
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:  # ปุ่มกดรันเองได้จากหน้า Actions

permissions:
  contents: read
  pages: write
  id-token: write

# กัน deploy ซ้อนกัน — รันอันล่าสุดทิ้งอันเก่า
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
